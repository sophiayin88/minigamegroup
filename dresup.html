<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인형 옷 입히기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .home-link {
      align-self: flex-start;
      color: #a0a0c0;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 10px;
      transition: color 0.2s;
    }
    .home-link:hover { color: #e94560; }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #e94560;
      text-shadow: 0 0 20px rgba(233,69,96,0.5);
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .game-wrap {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 780px;
    }

    /* Doll stage */
    .doll-stage {
      background: linear-gradient(160deg, #1e2d52, #16213e);
      border: 2px solid #0f3460;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 240px;
    }

    .doll-stage svg {
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
    }

    .reset-btn {
      background: #16213e;
      border: 2px solid #0f3460;
      color: #a0a0c0;
      border-radius: 6px;
      padding: 7px 20px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .reset-btn:hover { border-color: #e94560; color: #e94560; }

    /* Wardrobe panel */
    .wardrobe {
      flex: 1;
      min-width: 280px;
      max-width: 360px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 14px;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      border-bottom: 2px solid #0f3460;
    }

    .tab {
      flex: 1;
      min-width: 70px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      color: #a0a0c0;
      border: none;
      background: transparent;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }

    .tab.active {
      color: #e94560;
      border-bottom-color: #e94560;
      background: rgba(233,69,96,0.07);
    }
    .tab:hover:not(.active) { color: #e0e0e0; background: rgba(255,255,255,0.04); }

    .items-panel {
      display: none;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .items-panel.hidden { display: none; }

    .item-card {
      background: #1a1a2e;
      border: 2px solid #0f3460;
      border-radius: 10px;
      padding: 8px 4px 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .item-card:hover { border-color: #e94560; background: #1e2d52; }
    .item-card.active { border-color: #4ade80; background: rgba(74,222,128,0.08); }

    .item-card svg { display: block; }

    .item-label {
      font-size: 0.68rem;
      color: #a0a0c0;
      line-height: 1.2;
    }

    .item-card.active .item-label { color: #4ade80; }
    .item-card.none-card .item-label { color: #605870; }
    .item-card.none-card:hover { border-color: #605870; }

    @media (max-width: 560px) {
      .game-wrap { gap: 14px; }
      .wardrobe { min-width: 260px; }
    }
  </style>
</head>

  </div>

  <script>
    const state = { hair: null, top: null, bottom: null, dress: null, shoes: null, acc: null };

    // Dress replaces top+bottom — track which SVG groups to toggle per category
    const SVGMAP = {
      hair:   { back: id => 'hb-' + id, front: id => 'hf-' + id },
      top:    { front: id => 'top-'    + id },
      bottom: { front: id => 'bottom-' + id },
      dress:  { front: id => 'dress-'  + id },
      shoes:  { front: id => 'shoes-'  + id },
      acc:    { front: id => 'acc-'    + id }
    };

    function showTab(cat) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        const cats = ['hair','top','bottom','dress','shoes','acc'];
        t.classList.toggle('active', cats[i] === cat);
      });
      document.querySelectorAll('.items-panel').forEach(p => {
        p.classList.add('hidden');
        p.style.display = 'none';
      });
      const panel = document.getElementById('panel-' + cat);
      panel.classList.remove('hidden');
      panel.style.display = 'grid';
    }

    function selectItem(card) {
      const cat = card.dataset.cat;
      const id  = card.dataset.id;

      // Deactivate all cards in same category
      document.querySelectorAll(`[data-cat="${cat}"]`).forEach(c => c.classList.remove('active'));
      card.classList.add('active');

      // Hide previously shown items in this category
      if (state[cat]) hideItem(cat, state[cat]);
      state[cat] = id === 'none' ? null : id;
      if (state[cat]) showItem(cat, state[cat]);

      // Dress <-> top/bottom mutual exclusion
      if (cat === 'dress' && id !== 'none') {
        if (state.top)    { hideItem('top', state.top);    state.top = null; }
        if (state.bottom) { hideItem('bottom', state.bottom); state.bottom = null; }
        document.querySelectorAll('[data-cat="top"],[data-cat="bottom"]').forEach(c => c.classList.remove('active'));
      }
      if ((cat === 'top' || cat === 'bottom') && id !== 'none') {
        if (state.dress) { hideItem('dress', state.dress); state.dress = null; }
        document.querySelectorAll('[data-cat="dress"]').forEach(c => c.classList.remove('active'));
      }
    }

    function showItem(cat, id) {
      const map = SVGMAP[cat];
      if (map.back)  { const el = document.getElementById(map.back(id));  if (el) el.style.display = ''; }
      if (map.front) { const el = document.getElementById(map.front(id)); if (el) el.style.display = ''; }
    }

    function hideItem(cat, id) {
      const map = SVGMAP[cat];
      if (map.back)  { const el = document.getElementById(map.back(id));  if (el) el.style.display = 'none'; }
      if (map.front) { const el = document.getElementById(map.front(id)); if (el) el.style.display = 'none'; }
    }

    function resetAll() {
      ['hair','top','bottom','dress','shoes','acc'].forEach(cat => {
        if (state[cat]) { hideItem(cat, state[cat]); state[cat] = null; }
      });
      document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
    }

    // Show hair panel by default
    showTab('hair');
  </script>

</body>
</html>
