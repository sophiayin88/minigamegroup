<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지뢰찾기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 30px 20px;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #e94560;
      text-shadow: 0 0 20px rgba(233,69,96,0.5);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-difficulty {
      background: #16213e;
      color: #a0a0c0;
      border: 2px solid #0f3460;
    }

    .btn-difficulty.active {
      background: #0f3460;
      color: #e94560;
      border-color: #e94560;
    }

    .btn-difficulty:hover { background: #0f3460; color: #fff; }

    .btn-reset {
      background: #e94560;
      color: #fff;
      padding: 8px 24px;
    }

    .btn-reset:hover { background: #c73652; transform: scale(1.05); }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 32px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 10px;
      padding: 10px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      min-width: 280px;
      justify-content: space-between;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-icon { font-size: 1.3rem; }

    .status-value {
      font-size: 1.4rem;
      color: #e94560;
      font-variant-numeric: tabular-nums;
      min-width: 36px;
      text-align: right;
    }

    #face-btn {
      font-size: 1.6rem;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.1s;
    }

    #face-btn:hover { transform: scale(1.2); }

    .board-wrapper {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    #board {
      display: grid;
      gap: 3px;
      user-select: none;
    }

    .cell {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s, transform 0.05s;
      position: relative;
    }

    .cell.hidden {
      background: #0f3460;
      border: 2px solid #1a4a80;
    }

    .cell.hidden:hover {
      background: #1a5090;
      transform: scale(1.08);
    }

    .cell.revealed {
      background: #0a1628;
      border: 2px solid #0d2040;
      cursor: default;
    }

    .cell.flagged {
      background: #0f3460;
      border: 2px solid #e94560;
    }

    .cell.mine-hit {
      background: #e94560;
      border: 2px solid #ff6b6b;
    }

    .cell.mine-revealed {
      background: #0a1628;
      border: 2px solid #0d2040;
    }

    .n1 { color: #4fc3f7; }
    .n2 { color: #81c784; }
    .n3 { color: #e57373; }
    .n4 { color: #9575cd; }
    .n5 { color: #ff8a65; }
    .n6 { color: #4dd0e1; }
    .n7 { color: #f06292; }
    .n8 { color: #bdbdbd; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    .overlay.hidden { display: none; }

    .result-box {
      background: #16213e;
      border: 2px solid #e94560;
      border-radius: 16px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 0 60px rgba(233,69,96,0.3);
    }

    .result-box.win { border-color: #81c784; box-shadow: 0 0 60px rgba(129,199,132,0.3); }

    .result-emoji { font-size: 4rem; margin-bottom: 12px; }

    .result-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .result-box.win .result-title { color: #81c784; }
    .result-box.lose .result-title { color: #e94560; }

    .result-sub {
      font-size: 1rem;
      color: #a0a0c0;
      margin-bottom: 24px;
    }

    .info-text {
      font-size: 0.8rem;
      color: #5a5a7a;
      text-align: center;
    }

    .home-link {
      align-self: flex-start;
      color: #a0a0c0;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 4px;
      transition: color 0.2s;
    }
    .home-link:hover { color: #e94560; }
  </style>
</head>
<body>
  <div class="container">
    <a class="home-link" href="index.html">← 홈으로</a>
    <h1>지뢰찾기</h1>

    <div class="controls">
      <button class="btn btn-difficulty active" data-level="beginner">초급 (9×9)</button>
      <button class="btn btn-difficulty" data-level="intermediate">중급 (16×16)</button>
      <button class="btn btn-difficulty" data-level="expert">고급 (30×16)</button>
    </div>

    <div class="status-bar">
      <div class="status-item">
        <span class="status-icon">💣</span>
        <span class="status-value" id="mine-count">10</span>
      </div>
      <button id="face-btn">😊</button>
      <div class="status-item">
        <span class="status-icon">⏱</span>
        <span class="status-value" id="timer">0</span>
      </div>
    </div>

    <div class="board-wrapper">
      <div id="board"></div>
    </div>

    <div class="info-text">좌클릭: 열기 &nbsp;|&nbsp; 우클릭: 깃발 꽂기</div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="result-box" id="result-box">
      <div class="result-emoji" id="result-emoji"></div>
      <div class="result-title" id="result-title"></div>
      <div class="result-sub" id="result-sub"></div>
      <button class="btn btn-reset" onclick="newGame()">다시 시작</button>
    </div>
  </div>

  <script>
    const LEVELS = {
      beginner:     { rows: 9,  cols: 9,  mines: 10 },
      intermediate: { rows: 16, cols: 16, mines: 40 },
      expert:       { rows: 16, cols: 30, mines: 99 },
    };

    let level = 'beginner';
    let board = [];
    let revealed = [];
    let flagged = [];
    let mineLocations = new Set();
    let gameState = 'idle'; // idle | playing | won | lost
    let timerInterval = null;
    let seconds = 0;
    let firstClick = true;
    let { rows, cols, mines } = LEVELS[level];

    function newGame() {
      clearInterval(timerInterval);
      seconds = 0;
      firstClick = true;
      gameState = 'idle';
      ({ rows, cols, mines } = LEVELS[level]);

      board = Array.from({ length: rows }, () => Array(cols).fill(0));
      revealed = Array.from({ length: rows }, () => Array(cols).fill(false));
      flagged = Array.from({ length: rows }, () => Array(cols).fill(false));
      mineLocations = new Set();

      document.getElementById('timer').textContent = '0';
      document.getElementById('mine-count').textContent = mines;
      document.getElementById('face-btn').textContent = '😊';
      document.getElementById('overlay').classList.add('hidden');

      renderBoard();
    }

    function placeMines(safeR, safeC) {
      const safe = new Set();
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          const nr = safeR + dr, nc = safeC + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols)
            safe.add(nr * cols + nc);
        }

      while (mineLocations.size < mines) {
        const idx = Math.floor(Math.random() * rows * cols);
        if (!safe.has(idx)) mineLocations.add(idx);
      }

      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          board[r][c] = mineLocations.has(r * cols + c) ? -1 : 0;

      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          if (board[r][c] !== -1)
            board[r][c] = countNeighborMines(r, c);
    }

    function countNeighborMines(r, c) {
      let count = 0;
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && mineLocations.has(nr * cols + nc))
            count++;
        }
      return count;
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.style.gridTemplateColumns = `repeat(${cols}, 36px)`;
      boardEl.innerHTML = '';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell hidden';
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.addEventListener('click', onLeftClick);
          cell.addEventListener('contextmenu', onRightClick);
          boardEl.appendChild(cell);
        }
      }
    }

    function getCell(r, c) {
      return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    }

    function updateCell(r, c) {
      const cell = getCell(r, c);
      if (!cell) return;

      cell.className = 'cell';
      cell.textContent = '';

      if (flagged[r][c]) {
        cell.classList.add('flagged');
        cell.textContent = '🚩';
      } else if (!revealed[r][c]) {
        cell.classList.add('hidden');
      } else if (board[r][c] === -1) {
        cell.classList.add('mine-revealed');
        cell.textContent = '💣';
      } else {
        cell.classList.add('revealed');
        if (board[r][c] > 0) {
          cell.textContent = board[r][c];
          cell.classList.add(`n${board[r][c]}`);
        }
      }
    }

    function onLeftClick(e) {
      const r = +e.currentTarget.dataset.r;
      const c = +e.currentTarget.dataset.c;

      if (gameState === 'won' || gameState === 'lost') return;
      if (flagged[r][c] || revealed[r][c]) return;

      if (firstClick) {
        firstClick = false;
        placeMines(r, c);
        gameState = 'playing';
        timerInterval = setInterval(() => {
          seconds++;
          document.getElementById('timer').textContent = Math.min(seconds, 999);
        }, 1000);
      }

      if (board[r][c] === -1) {
        revealed[r][c] = true;
        updateCell(r, c);
        getCell(r, c).classList.add('mine-hit');
        endGame(false);
        return;
      }

      floodReveal(r, c);
      checkWin();
    }

    function onRightClick(e) {
      e.preventDefault();
      const r = +e.currentTarget.dataset.r;
      const c = +e.currentTarget.dataset.c;

      if (gameState === 'won' || gameState === 'lost') return;
      if (revealed[r][c]) return;
      if (gameState === 'idle') return;

      flagged[r][c] = !flagged[r][c];
      updateCell(r, c);

      const remaining = mines - flagged.flat().filter(Boolean).length;
      document.getElementById('mine-count').textContent = remaining;
    }

    function floodReveal(r, c) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) return;
      if (revealed[r][c] || flagged[r][c]) return;

      revealed[r][c] = true;
      updateCell(r, c);

      if (board[r][c] === 0) {
        for (let dr = -1; dr <= 1; dr++)
          for (let dc = -1; dc <= 1; dc++)
            if (dr !== 0 || dc !== 0)
              floodReveal(r + dr, c + dc);
      }
    }

    function checkWin() {
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          if (!mineLocations.has(r * cols + c) && !revealed[r][c])
            return;
      endGame(true);
    }

    function endGame(won) {
      clearInterval(timerInterval);
      gameState = won ? 'won' : 'lost';

      if (!won) {
        document.getElementById('face-btn').textContent = '😵';
        mineLocations.forEach(idx => {
          const r = Math.floor(idx / cols), c = idx % cols;
          if (!flagged[r][c]) {
            revealed[r][c] = true;
            updateCell(r, c);
          }
        });
      } else {
        document.getElementById('face-btn').textContent = '😎';
      }

      setTimeout(() => {
        const overlay = document.getElementById('overlay');
        const box = document.getElementById('result-box');
        overlay.classList.remove('hidden');
        box.className = 'result-box ' + (won ? 'win' : 'lose');
        document.getElementById('result-emoji').textContent = won ? '🎉' : '💥';
        document.getElementById('result-title').textContent = won ? '성공!' : '게임 오버';
        document.getElementById('result-sub').textContent = won
          ? `${seconds}초 만에 클리어했습니다!`
          : '지뢰를 밟았습니다. 다시 도전해 보세요!';
      }, won ? 300 : 600);
    }

    document.querySelectorAll('.btn-difficulty').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-difficulty').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        level = btn.dataset.level;
        newGame();
      });
    });

    document.getElementById('face-btn').addEventListener('click', newGame);

    newGame();
  </script>
</body>
</html>
