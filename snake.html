<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뱀 게임</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 20px;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
    }

    .home-link {
      align-self: flex-start;
      color: #a0a0c0;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 12px;
      transition: color 0.2s;
    }
    .home-link:hover { color: #e94560; }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #e94560;
      text-shadow: 0 0 20px rgba(233,69,96,0.5);
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .score-bar {
      display: flex;
      gap: 36px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      padding: 10px 36px;
      margin-bottom: 16px;
      font-size: 1rem;
      font-weight: 600;
    }

    .score-label { color: #a0a0c0; }
    .score-value { color: #e94560; }

    canvas {
      border: 2px solid #0f3460;
      border-radius: 6px;
      display: block;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 8px 22px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-primary { background: #e94560; color: #fff; }
    .btn-primary:hover { background: #c73652; transform: scale(1.04); }

    .btn-diff {
      background: #16213e;
      color: #a0a0c0;
      border: 2px solid #0f3460;
    }
    .btn-diff.active {
      background: #0f3460;
      color: #e94560;
      border-color: #e94560;
    }
    .btn-diff:hover { background: #0f3460; color: #fff; }

    .tip {
      margin-top: 10px;
      color: #505070;
      font-size: 0.82rem;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay.hidden { display: none; }

    .overlay-box {
      background: #16213e;
      border: 2px solid #e94560;
      border-radius: 14px;
      padding: 44px 64px;
      text-align: center;
    }

    .overlay-title {
      font-size: 2rem;
      font-weight: 700;
      color: #e94560;
      margin-bottom: 10px;
    }

    .overlay-score {
      font-size: 1rem;
      color: #a0a0c0;
      margin-bottom: 24px;
    }

    /* Mobile d-pad */
    .dpad {
      display: none;
      margin-top: 16px;
      gap: 4px;
      flex-direction: column;
      align-items: center;
    }
    .dpad-row { display: flex; gap: 4px; }
    .dpad-btn {
      width: 52px;
      height: 52px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 1.4rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dpad-btn:active { background: #0f3460; }

    @media (max-width: 480px) {
      .dpad { display: flex; }
      .tip { display: none; }
    }
  </style>
</head>
<body>

  <a class="home-link" href="index.html">← 홈으로</a>
  <h1>🐍 뱀 게임</h1>

  <div class="score-bar">
    <span><span class="score-label">점수 </span><span class="score-value" id="score">0</span></span>
    <span><span class="score-label">최고 </span><span class="score-value" id="best">0</span></span>
    <span><span class="score-label">속도 </span><span class="score-value" id="speedLabel">쉬움</span></span>
  </div>

  <canvas id="canvas" width="400" height="400"></canvas>

  <div class="controls">
    <button class="btn btn-diff active" id="diff-easy"   onclick="setDiff('easy')">쉬움</button>
    <button class="btn btn-diff"        id="diff-normal" onclick="setDiff('normal')">보통</button>
    <button class="btn btn-diff"        id="diff-hard"   onclick="setDiff('hard')">어려움</button>
    <button class="btn btn-primary" onclick="startGame()">시작 / 재시작</button>
  </div>

  <p class="tip">방향키 또는 WASD 로 이동</p>

  <div class="dpad">
    <div class="dpad-row"><button class="dpad-btn" id="btn-up"    onclick="dpadInput('up')">▲</button></div>
    <div class="dpad-row">
      <button class="dpad-btn" id="btn-left"  onclick="dpadInput('left')">◀</button>
      <button class="dpad-btn" id="btn-down"  onclick="dpadInput('down')">▼</button>
      <button class="dpad-btn" id="btn-right" onclick="dpadInput('right')">▶</button>
    </div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="overlay-box">
      <div class="overlay-title" id="overlayTitle">게임 오버!</div>
      <div class="overlay-score" id="overlayScore"></div>
      <button class="btn btn-primary" onclick="startGame()">다시 시작</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const CELL   = 20;
    const COLS   = canvas.width  / CELL;
    const ROWS   = canvas.height / CELL;

    const SPEEDS = { easy: 160, normal: 100, hard: 55 };
    const SPEED_LABELS = { easy: '쉬움', normal: '보통', hard: '어려움' };

    let diff = 'easy';
    let snake, dir, nextDir, food, score, gameLoop, running = false;
    let best = 0;

    function setDiff(d) {
      diff = d;
      document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
      document.getElementById('diff-' + d).classList.add('active');
      document.getElementById('speedLabel').textContent = SPEED_LABELS[d];
    }

    function startGame() {
      clearInterval(gameLoop);
      document.getElementById('overlay').classList.add('hidden');
      snake   = [{ x: 10, y: 10 }];
      dir     = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score   = 0;
      updateScore();
      placeFood();
      running   = true;
      gameLoop  = setInterval(tick, SPEEDS[diff]);
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function tick() {
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        if (score > best) best = score;
        updateScore();
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#16213e';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
      }

      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
        const r = i === 0 ? 5 : 3;
        const x = seg.x * CELL + 1, y = seg.y * CELL + 1, s = CELL - 2;
        ctx.beginPath();
        ctx.roundRect(x, y, s, s, r);
        ctx.fill();
      });

      if (snake.length > 1) {
        const h = snake[0];
        ctx.fillStyle = '#1a1a2e';
        const ex = h.x * CELL + CELL / 2, ey = h.y * CELL + CELL / 2;
        const ox = dir.x === 0 ? 4 : 0, oy = dir.y === 0 ? 4 : 0;
        ctx.beginPath(); ctx.arc(ex - ox * dir.y, ey - oy * dir.x, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + ox * dir.y, ey + oy * dir.x, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
      document.getElementById('best').textContent  = best;
    }

    function gameOver() {
      clearInterval(gameLoop);
      running = false;
      document.getElementById('overlayTitle').textContent = '게임 오버!';
      document.getElementById('overlayScore').textContent = `점수: ${score}  |  최고: ${best}`;
      document.getElementById('overlay').classList.remove('hidden');
    }

    function applyDir(dx, dy) {
      if (!(dx === -dir.x && dy === -dir.y)) {
        nextDir = { x: dx, y: dy };
        if (!running) startGame();
      }
    }

    function dpadInput(side) {
      const map = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
      const [dx, dy] = map[side];
      applyDir(dx, dy);
    }

    document.addEventListener('keydown', e => {
      const keys = {
        ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
        w: [0,-1], s: [0,1], a: [-1,0], d: [1,0]
      };
      const v = keys[e.key];
      if (v) { e.preventDefault(); applyDir(v[0], v[1]); }
    });

    // Idle screen
    (function idleScreen() {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#505070';
      ctx.font = '15px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('시작 버튼을 누르거나 방향키를 입력하세요', canvas.width / 2, canvas.height / 2);
    })();
  </script>

</body>
</html>
